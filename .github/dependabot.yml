version: 2
updates:
  # npm 依赖
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      # 开发依赖的小版本/补丁合并成一个 PR，避免 PR 洪水
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions
  #
  # 注意：如果把 action 固定到完整 40 位 commit SHA（安全加固建议），
  # Dependabot **不会**再对这些 action 发出升级告警——它只识别 tag 形式的引用。
  # 本项目当前使用 tag（@v4），因此 Dependabot 能正常维护；若将来改为 SHA 固定，
  # 必须同时引入 Renovate 或定期手动升级 SHA 的机制，否则会静默停止更新。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
