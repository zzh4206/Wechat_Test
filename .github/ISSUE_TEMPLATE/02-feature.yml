name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的问题**，再谈方案——方案的取舍取决于问题本身。

        注意：本项目在 `0.y.z` 阶段，公共接口与配置项都可能变化。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在有什么不方便或做不到？谁会遇到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案与取舍
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响面（可多选）
      options:
        - label: 涉及读取边界（白名单 / 审计 / 只读约束）
        - label: 涉及发送能力
        - label: 涉及 LLM 调用成本或隐私
        - label: 需要改动配置项（属破坏性变更）
